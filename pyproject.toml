[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqmarl-slam"
version = "0.1.0"
description = "Auditable cooperative active-SLAM critic experiments"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "torch", "gymnasium", "jsonschema", "PyYAML"]

[project.optional-dependencies]
quantum = ["pennylane"]
slam = ["gtsam"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["eqmarl_slam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

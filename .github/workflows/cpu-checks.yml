name: CPU correctness
on: [push, pull_request]
jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
      - run: python -m pytest -q
      - run: python scripts/validate_plan.py
      - run: |
          for manifest in experiments/??/*/manifest.json; do
            [ -f "$manifest" ] || continue
            python -m eqmarl_slam.cli verify --run "$(dirname "$manifest")"
          done
